name: Build container images

on:
  push:
    branches:
      - main
    paths:
      - "llvm-aarch64-unknown-linux-musl/**"
      - "llvm-x86_64-unknown-linux-musl/**"
      - ".github/workflows/build-container-images.yml"
  pull_request:
    paths:
      - "llvm-aarch64-unknown-linux-musl/**"
      - "llvm-x86_64-unknown-linux-musl/**"
      - ".github/workflows/build-container-images.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - runner: ubuntu-latest
            platforms: linux/amd64
          - runner: ubuntu-24.04-arm
            platforms: linux/arm64
        target:
          - name: llvm-aarch64-unknown-linux-musl
            context: ./llvm-aarch64-unknown-linux-musl
            tag: llvm-aarch64-unknown-linux-musl
          - name: llvm-x86_64-unknown-linux-musl
            context: ./llvm-x86_64-unknown-linux-musl
            tag: llvm-x86_64-unknown-linux-musl
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          platforms: ${{ matrix.host.platforms }}
          tags: ghcr.io/${{ github.repository }}:${{ matrix.target.tag }}
